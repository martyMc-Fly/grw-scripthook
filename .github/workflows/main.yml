
name: Build FOV Changer

on:
  workflow_dispatch:
  push:
    paths:
      - 'fov_changer.c'
      - 'scripthook.h'
      - 'libscripthook.a'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Windows compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Compile FOV Changer
        run: |
          mkdir -p dist
          x86_64-w64-mingw32-gcc -O2 -Wall -Wextra -shared -static-libgcc \
            -o dist/fov_changer.asi \
            fov_changer.c -L. -lscripthook -lgdi32 -luser32

      - name: Save compiled plugin
        uses: actions/upload-artifact@v4
        with:
          name: fov-changer-asi
          path: dist/fov_changer.asi
